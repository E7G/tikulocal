name: Rust release
on:
  push:
    branches: [rust-native-rewrite-583fd341]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: tikulocal-windows-x64.exe
            binary: tikulocal.exe
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: tikulocal-linux-x64
            binary: tikulocal
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: tikulocal-macos-arm64
            binary: tikulocal
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: tikulocal-macos-x64
            binary: tikulocal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev pkg-config
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Android APK with Gradle
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/24.0.8215888"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon :app:assembleDebug
      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tikulocal-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tikulocal-android-arm64.apk
          path: tikulocal-android-arm64.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: tikulocal-android-arm64.apk
