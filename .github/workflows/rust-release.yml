name: Rust release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_preview:
        description: Build all desktop targets and Android APK as temporary workflow artifacts
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev pkg-config
      - name: Run tests
        run: cargo test --locked

  desktop:
    name: Build desktop (${{ matrix.asset }})
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_preview)
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: tikulocal-windows-x64.exe
            binary: tikulocal.exe
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: tikulocal-linux-x64
            binary: tikulocal
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: tikulocal-macos-arm64
            binary: tikulocal
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: tikulocal-macos-x64
            binary: tikulocal
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev pkg-config
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android ARM64 APK
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_preview)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK/NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Android APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/24.0.8215888"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/tikulocal-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          path: dist/tikulocal-android-arm64.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download all build assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and generate SHA-256 checksums
        run: |
          set -euo pipefail
          for asset in tikulocal-windows-x64.exe tikulocal-linux-x64 tikulocal-macos-arm64 tikulocal-macos-x64 tikulocal-android-arm64.apk; do
            test -s "release-assets/$asset" || { echo "::error::Missing release asset: $asset"; exit 1; }
          done
          cd release-assets
          sha256sum tikulocal-* > SHA256SUMS.txt
          ls -lh
      - name: Create or update release exactly once
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## Downloads

          - **Windows x64:** `tikulocal-windows-x64.exe`
          - **Linux x64:** `tikulocal-linux-x64`
          - **macOS ARM64 (Apple Silicon):** `tikulocal-macos-arm64`
          - **macOS x64 (Intel):** `tikulocal-macos-x64`
          - **Android ARM64:** `tikulocal-android-arm64.apk`

          SHA-256 checksums for all downloads are included in `SHA256SUMS.txt`.

          > Android APK is currently debug-signed for preview/testing. A stable production signing key is not configured.
          EOF

          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG already exists; synchronizing its assets."
            while IFS= read -r old_asset; do
              if [ -n "$old_asset" ] && [ ! -f "release-assets/$old_asset" ]; then
                gh release delete-asset "$TAG" "$old_asset" --yes
              fi
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release upload "$TAG" release-assets/* --clobber
            if [[ "$TAG" == *-* ]]; then
              gh release edit "$TAG" --title "TikuLocal $TAG" --prerelease
            else
              gh release edit "$TAG" --title "TikuLocal $TAG" --latest
            fi
          elif [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" release-assets/* --verify-tag --generate-notes --notes "$(cat release-notes.md)" --title "TikuLocal $TAG" --prerelease
          else
            gh release create "$TAG" release-assets/* --verify-tag --generate-notes --notes "$(cat release-notes.md)" --title "TikuLocal $TAG" --latest
          fi
