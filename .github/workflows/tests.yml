name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install parser test dependency
        run: python -m pip install --upgrade pip python-docx

      - name: Compile Python sources
        run: python -m py_compile main.py parser.py

      - name: Run parser regression tests
        run: python -m unittest discover -s tests -v

  ui-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Smoke test Qt application initialization
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -c "from PyQt5.QtWidgets import QApplication;
          from main import TikuApp;
          TikuApp.start_http_server = lambda self: None;
          app = QApplication([]);
          window = TikuApp();
          assert window.import_page.selected_files == [];
          assert window.manage_page.table.rowCount() == 0;
          window.close()"
