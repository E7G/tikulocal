name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install parser test dependency
        run: python -m pip install --upgrade pip python-docx

      - name: Compile Python sources
        run: python -m py_compile main.py parser.py

      - name: Run parser regression tests
        run: python -m unittest discover -s tests -v
