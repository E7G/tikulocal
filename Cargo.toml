[package]
name = "tikulocal"
version = "0.3.0"
edition = "2021"
description = "Native Rust local question bank with GUI and adapter API"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slint = { version = "=1.13.1", default-features = false, features = ["std", "renderer-femtovg", "compat-1-2"] }

rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
regex = "1"
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[build-dependencies]
slint-build = "=1.13.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.13.1", default-features = false, features = ["backend-winit"] }
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.13.1", default-features = false, features = ["backend-android-activity-06"] }
jni = "0.21"
